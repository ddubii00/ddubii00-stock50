<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>stock50 뉴스 분석</title>
  <link rel="stylesheet" href="/stock50-7/static/style.css?v=20260925-3">
</head>
<body>
<main>
  <header>
    <div>
      <p class="eyebrow">MANUAL AI · KOREAN + US STOCK IMPACT</p>
      <h1>stock50 <em>뉴스 영향 분석</em></h1>
      <p id="status">기사 데이터를 불러오는 중…</p>
    </div>
    <div class="actions">
      <button id="collect">새로 수집</button>
      <button id="copy">AI 분석용 자료 복사</button>
      <button class="accent" id="openModal">AI 분석 결과 붙여넣기</button>
    </div>
  </header>

  <section id="top" class="top-grid"></section>

  <section class="panel">
    <div class="section-head">
      <h2>AI 선정 주요기사 <span id="analysisCount">0</span></h2>
      <select id="snapshots"><option value="">현재 분석</option></select>
    </div>
    <div id="analyses" class="cards">
      <p class="muted">분석 결과를 저장하면 정확히 3줄의 AI 요약이 표시됩니다.</p>
    </div>
  </section>

  <section class="panel">
    <div class="section-head">
      <h2>AI 분석 후보</h2>
      <div>
        <button data-count="30">상위 30</button>
        <button data-count="50">상위 50</button>
        <button id="all">전체 선택</button>
        <button id="none">전체 해제</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th></th><th>후보점수</th><th>날짜</th><th>섹션</th><th>제목</th><th>snippet</th><th>원문</th>
        </tr>
      </thead>
      <tbody id="candidates"></tbody>
    </table>
  </section>
</main>

<dialog id="modal">
  <form method="dialog">
    <div class="section-head">
      <h2>AI 분석 결과 붙여넣기</h2>
      <button>×</button>
    </div>
    <textarea id="raw" placeholder="ChatGPT가 반환한 JSON을 붙여넣으세요."></textarea>
    <p id="validation"></p>
    <footer>
      <button type="button" id="validate">검증</button>
      <button type="button" class="accent" id="save">저장</button>
      <button>취소</button>
    </footer>
  </form>
</dialog>

<div id="toast"></div>
<script>
window.setTimeout(() => {
  const el = document.getElementById("status");
  if (el && el.textContent.includes("불러오는 중")) {
    el.textContent = "프론트엔드 또는 API 응답을 기다리는 중입니다…";
  }
}, 8000);
</script>
<script src="/stock50-7/static/app.js?v=20260925-3"></script>
</body>
</html>
